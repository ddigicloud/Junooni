<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/junooni-favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Junooni Creator Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
